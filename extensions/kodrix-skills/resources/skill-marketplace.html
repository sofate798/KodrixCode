<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; font-src {{cspSource}}; script-src {{cspSource}} 'unsafe-inline'; img-src {{cspSource}} data:;" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Skill 市场</title>
	<link rel="stylesheet" href="{{codiconsCssUri}}">
	<style>
		:root {
			--gap: 8px;
			--radius: 6px;
			--fg: var(--vscode-foreground);
			--fg-dim: var(--vscode-descriptionForeground);
			--bg: var(--vscode-sideBar-background);
			--bg2: var(--vscode-editor-background);
			--border: var(--vscode-widget-border, var(--vscode-panel-border));
			--input-bg: var(--vscode-input-background);
			--input-fg: var(--vscode-input-foreground);
			--input-border: var(--vscode-input-border, transparent);
			--btn: var(--vscode-button-background);
			--btn-fg: var(--vscode-button-foreground);
			--btn-hover: var(--vscode-button-hoverBackground);
			--btn2: var(--vscode-button-secondaryBackground);
			--btn2-fg: var(--vscode-button-secondaryForeground);
			--btn2-hover: var(--vscode-button-secondaryHoverBackground);
			--focus: var(--vscode-focusBorder);
			--badge: var(--vscode-badge-background);
			--badge-fg: var(--vscode-badge-foreground);
			--list-hover: var(--vscode-list-hoverBackground);
			--error: var(--vscode-errorForeground);
			--icon: var(--vscode-icon-foreground);
		}
		* { box-sizing: border-box; }
		html, body {
			margin: 0; padding: 0; height: 100%;
			font-family: var(--vscode-font-family);
			font-size: var(--vscode-font-size);
			color: var(--fg);
			background: var(--bg);
		}
		.wrap { display: flex; flex-direction: column; height: 100%; }
		.toolbar {
			display: flex; flex-direction: column; gap: 6px;
			padding: 10px 10px 8px; border-bottom: 1px solid var(--border);
			flex-shrink: 0;
		}
		.search {
			display: flex; gap: 6px; align-items: center;
		}
		.search input, .gh-row input {
			flex: 1; min-width: 0;
			padding: 5px 8px;
			border: 1px solid var(--input-border);
			background: var(--input-bg); color: var(--input-fg);
			border-radius: 2px; outline: none;
		}
		.search input:focus, .gh-row input:focus {
			outline: 1px solid var(--focus);
		}
		.tabs { display: flex; gap: 2px; }
		.tab {
			flex: 1; padding: 5px 4px; border: none; cursor: pointer;
			background: transparent; color: var(--fg-dim);
			border-radius: var(--radius); font: inherit;
			display: inline-flex; align-items: center; justify-content: center; gap: 4px;
		}
		.tab .codicon { font-size: 14px; }
		.tab.active {
			background: var(--list-hover); color: var(--fg); font-weight: 600;
		}
		.actions { display: flex; flex-wrap: wrap; gap: 4px; }
		.btn, button.btn {
			appearance: none; border: none; cursor: pointer;
			padding: 4px 10px; border-radius: 2px; font: inherit;
			background: var(--btn); color: var(--btn-fg);
			display: inline-flex; align-items: center; gap: 4px;
		}
		.btn .codicon { font-size: 14px; }
		.btn:hover { background: var(--btn-hover); }
		.btn:disabled { opacity: 0.55; cursor: default; }
		.btn.secondary {
			background: var(--btn2); color: var(--btn2-fg);
		}
		.btn.secondary:hover { background: var(--btn2-hover); }
		.btn.sm { padding: 3px 8px; font-size: 12px; }
		.btn.icon-only { padding: 4px 6px; }
		.btn.danger {
			background: transparent; color: var(--error);
			border: 1px solid color-mix(in srgb, var(--error) 40%, transparent);
		}
		.panel { display: none; flex-direction: column; gap: 6px; }
		.panel.active { display: flex; }
		.gh-row { display: flex; gap: 6px; }
		.hint { color: var(--fg-dim); font-size: 11px; line-height: 1.35; }
		.list {
			flex: 1; overflow: auto; padding: 8px 10px 16px;
		}
		.card {
			display: grid;
			grid-template-columns: 36px 1fr auto;
			gap: 8px 10px;
			padding: 10px 8px;
			border-radius: var(--radius);
			border: 1px solid transparent;
		}
		.card:hover { background: var(--list-hover); }
		.card + .card { border-top: 1px solid var(--border); }
		.icon {
			width: 36px; height: 36px; border-radius: 8px;
			display: flex; align-items: center; justify-content: center;
			background: var(--bg2);
			border: 1px solid var(--border);
			color: var(--icon);
		}
		.icon .codicon { font-size: 18px; }
		.meta { min-width: 0; }
		.title {
			font-weight: 600; white-space: nowrap;
			overflow: hidden; text-overflow: ellipsis;
		}
		.sub {
			color: var(--fg-dim); font-size: 11px;
			white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
			display: inline-flex; align-items: center; gap: 4px;
		}
		.sub .codicon { font-size: 12px; }
		.desc {
			grid-column: 2 / 4;
			color: var(--fg-dim); font-size: 12px; line-height: 1.4;
			display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
			overflow: hidden;
		}
		.side {
			display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
		}
		.badge {
			font-size: 10px; padding: 1px 6px; border-radius: 999px;
			background: var(--badge); color: var(--badge-fg);
		}
		.empty {
			padding: 28px 12px; text-align: center; color: var(--fg-dim); font-size: 12px;
		}
		.empty .codicon {
			display: block; font-size: 28px; margin: 0 auto 8px; opacity: 0.7;
		}
		.status {
			padding: 4px 10px 8px; color: var(--fg-dim); font-size: 11px;
			border-top: 1px solid var(--border); flex-shrink: 0;
			min-height: 22px;
		}
		.status.err { color: var(--error); }
	</style>
</head>
<body>
	<div class="wrap">
		<div class="toolbar">
			<div class="search">
				<input id="q" type="search" placeholder="搜索 Skill…" autocomplete="off" />
				<button class="btn secondary sm icon-only" id="btnRefresh" title="刷新" aria-label="刷新">
					<i class="codicon codicon-refresh" aria-hidden="true"></i>
				</button>
			</div>
			<div class="tabs">
				<button class="tab active" data-tab="market">
					<i class="codicon codicon-extensions" aria-hidden="true"></i>市场
				</button>
				<button class="tab" data-tab="installed">
					<i class="codicon codicon-check" aria-hidden="true"></i>已安装
				</button>
				<button class="tab" data-tab="github">
					<i class="codicon codicon-github" aria-hidden="true"></i>GitHub
				</button>
			</div>
			<div class="panel active" id="panel-market">
				<div class="actions">
					<button class="btn secondary sm" id="btnUrl">
						<i class="codicon codicon-cloud-download" aria-hidden="true"></i>从 URL / 仓库安装
					</button>
					<button class="btn secondary sm" id="btnImport">
						<i class="codicon codicon-folder-opened" aria-hidden="true"></i>导入 ~/.cursor/skills
					</button>
				</div>
			</div>
			<div class="panel" id="panel-installed">
				<div class="hint">已安装到 ~/.agents/skills，Agent 可自动发现。</div>
			</div>
			<div class="panel" id="panel-github">
				<div class="gh-row">
					<input id="ghQ" type="search" placeholder="搜索 GitHub 仓库（含 SKILL.md）" value="SKILL.md cursor skill" />
					<button class="btn sm" id="btnGhSearch">
						<i class="codicon codicon-search" aria-hidden="true"></i>搜索
					</button>
				</div>
				<div class="hint">结果来自 GitHub API；点「安装」会下载仓库 zip 并提取 SKILL.md。</div>
			</div>
		</div>
		<div class="list" id="list"></div>
		<div class="status" id="status"></div>
	</div>
	<script>
		const vscode = acquireVsCodeApi();
		const state = { tab: 'market', q: '', items: [], installed: [], github: [], busy: null };

		const $ = (id) => document.getElementById(id);
		const listEl = $('list');
		const statusEl = $('status');
		const qEl = $('q');

		const DEFAULT_ICON = 'package';
		const ICON_RE = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;

		function setStatus(msg, isErr) {
			statusEl.textContent = msg || '';
			statusEl.classList.toggle('err', !!isErr);
		}

		function installName(it) {
			return it.installName || (it.id ? String(it.id).split('.').pop() : '') || it.name || '';
		}

		function normalizeIcon(raw, fallback) {
			const s = String(raw || '').trim();
			if (ICON_RE.test(s)) return s;
			return fallback || DEFAULT_ICON;
		}

		function ki(name) {
			return `<i class="codicon codicon-${normalizeIcon(name)}" aria-hidden="true"></i>`;
		}

		function matches(it, q) {
			if (!q) return true;
			const hay = [it.displayName, it.description, it.publisher, it.id, ...(it.tags || []), ...(it.categories || [])]
				.filter(Boolean).join(' ').toLowerCase();
			return hay.includes(q);
		}

		function render() {
			const q = state.q.trim().toLowerCase();
			let rows = [];
			if (state.tab === 'market') {
				rows = state.items.filter(it => matches(it, q)).map(it => {
					const name = installName(it);
					const installed = state.installed.includes(name);
					return card({
						icon: normalizeIcon(it.icon, DEFAULT_ICON),
						title: it.displayName || name,
						sub: `${it.publisher || 'kodrix'} · ${it.version || '1.0.0'}`,
						desc: it.description || '',
						badge: installed ? '已安装' : (it.kind || 'skill'),
						installed,
						primary: installed
							? { label: '卸载', action: 'uninstall', id: name, danger: true }
							: { label: '安装', action: 'install', id: it.id },
					});
				});
			} else if (state.tab === 'installed') {
				rows = state.installed
					.filter(n => !q || n.toLowerCase().includes(q))
					.map(name => {
						const cat = state.items.find(it => installName(it) === name);
						return card({
							icon: normalizeIcon(cat?.icon, 'check'),
							title: cat?.displayName || name,
							sub: name,
							desc: cat?.description || '本地已安装 Skill',
							badge: '已安装',
							installed: true,
							primary: { label: '卸载', action: 'uninstall', id: name, danger: true },
						});
					});
			} else {
				rows = state.github.filter(it => matches({
					displayName: it.full_name, description: it.description, publisher: it.owner,
				}, q)).map(it => {
					const name = (it.full_name || '').split('/').pop();
					const installed = state.installed.includes(name);
					const stars = it.stargazers_count || 0;
					return card({
						icon: 'github',
						title: it.full_name,
						subHtml: `${ki('star-full')} ${stars} · ${esc(it.language || 'repo')}`,
						desc: it.description || '',
						badge: installed ? '已安装' : 'GitHub',
						installed,
						primary: installed
							? { label: '卸载', action: 'uninstall', id: name, danger: true }
							: { label: '安装', action: 'installGithub', id: it.html_url || `https://github.com/${it.full_name}` },
						secondary: it.html_url ? { label: '打开', action: 'open', id: it.html_url } : null,
					});
				});
			}

			if (!rows.length) {
				const emptyIcon = state.tab === 'github' ? 'github' : state.tab === 'installed' ? 'inbox' : 'package';
				const emptyText = state.tab === 'github' ? '输入关键词搜索 GitHub，或点「搜索」。'
					: state.tab === 'installed' ? '还没有安装任何 Skill。'
					: '没有匹配的 Skill。';
				listEl.innerHTML = `<div class="empty">${ki(emptyIcon)}${emptyText}</div>`;
				return;
			}
			listEl.innerHTML = rows.join('');
		}

		function card({ icon, title, sub, subHtml, desc, badge, installed, primary, secondary }) {
			const pCls = primary.danger ? 'btn sm danger' : 'btn sm';
			const busy = state.busy === primary.id;
			const sec = secondary
				? `<button class="btn secondary sm" data-action="${secondary.action}" data-id="${esc(secondary.id)}">${ki('link-external')}${esc(secondary.label)}</button>`
				: '';
			const primaryLabel = busy
				? `${ki('loading')}…`
				: `${ki(primary.danger ? 'trash' : 'cloud-download')}${esc(primary.label)}`;
			return `<div class="card">
				<div class="icon">${ki(icon)}</div>
				<div class="meta">
					<div class="title" title="${esc(title)}">${esc(title)}</div>
					<div class="sub">${subHtml || esc(sub || '')}</div>
				</div>
				<div class="side">
					${badge ? `<span class="badge">${esc(badge)}</span>` : ''}
					<button class="${pCls}" data-action="${primary.action}" data-id="${esc(primary.id)}" ${busy ? 'disabled' : ''}>${primaryLabel}</button>
					${sec}
				</div>
				<div class="desc">${esc(desc)}</div>
			</div>`;
		}

		function esc(s) {
			return String(s ?? '').replace(/[&<>"']/g, c => ({
				'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
			})[c]);
		}

		document.querySelectorAll('.tab').forEach(tab => {
			tab.addEventListener('click', () => {
				state.tab = tab.dataset.tab;
				document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
				document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === `panel-${state.tab}`));
				qEl.placeholder = state.tab === 'github' ? '过滤搜索结果…' : '搜索 Skill…';
				render();
				if (state.tab === 'github' && !state.github.length) {
					vscode.postMessage({ type: 'searchGithub', query: $('ghQ').value.trim() });
				}
			});
		});

		qEl.addEventListener('input', () => { state.q = qEl.value; render(); });

		$('btnRefresh').addEventListener('click', () => vscode.postMessage({ type: 'refresh' }));
		$('btnUrl').addEventListener('click', () => vscode.postMessage({ type: 'installFromUrl' }));
		$('btnImport').addEventListener('click', () => vscode.postMessage({ type: 'importCursor' }));
		$('btnGhSearch').addEventListener('click', () => {
			vscode.postMessage({ type: 'searchGithub', query: $('ghQ').value.trim() });
		});
		$('ghQ').addEventListener('keydown', (e) => {
			if (e.key === 'Enter') vscode.postMessage({ type: 'searchGithub', query: $('ghQ').value.trim() });
		});

		listEl.addEventListener('click', (e) => {
			const btn = e.target.closest('button[data-action]');
			if (!btn || btn.disabled) return;
			const action = btn.dataset.action;
			const id = btn.dataset.id;
			state.busy = id;
			render();
			vscode.postMessage({ type: action, id });
		});

		window.addEventListener('message', (event) => {
			const msg = event.data || {};
			if (msg.type === 'state') {
				state.items = msg.items || [];
				state.installed = msg.installed || [];
				if (msg.github) state.github = msg.github;
				state.busy = null;
				setStatus(msg.status || `${state.items.length} 个官方 · ${state.installed.length} 已安装`);
				render();
			} else if (msg.type === 'githubResults') {
				state.github = msg.items || [];
				state.busy = null;
				setStatus(msg.status || `GitHub ${state.github.length} 个结果`, !!msg.error);
				render();
			} else if (msg.type === 'status') {
				state.busy = null;
				setStatus(msg.text || '', !!msg.error);
				render();
			} else if (msg.type === 'busy') {
				state.busy = msg.id || null;
				render();
			}
		});

		vscode.postMessage({ type: 'ready' });
	</script>
</body>
</html>
