name: PR Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: node build/eslint.ts
      - name: TypeScript compile check
        run: npm run compile-build
      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

  test-extensions:
    name: Test Minicode Extensions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        extension:
          - minicode-agent-os
          - minicode-local
          - minicode-solo
          - minicode-skills
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile extensions
        run: npm run compile-extensions
      - name: Unit tests
        run: npm run test --workspace=extensions/${{ matrix.extension }}
        continue-on-error: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.extension }}
          path: extensions/${{ matrix.extension }}/test-results/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (critical)
        run: npm audit --audit-level=critical
      - name: npm audit (high)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
