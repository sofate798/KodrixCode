name: PR Check

on:
  pull_request:
    branches: [master, insider]
    paths-ignore:
      - "**/*.md"
  push:
    branches: [master, insider]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: ESLint
        run: npm run eslint
      - name: TypeScript type check
        run: npm run typecheck-client

  extensions-test:
    name: Test ${{ matrix.extension }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        extension:
          - kodrix-agent-os
          - kodrix-local
          - kodrix-skills
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Compile & test ${{ matrix.extension }}
        working-directory: extensions/${{ matrix.extension }}
        run: |
          npm run compile:test
          npm test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: npm audit (critical)
        run: npm audit --audit-level=critical
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
