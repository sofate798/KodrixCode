name: PR Check

on:
  pull_request:
    branches: [master, insider]
    paths-ignore:
      - "**/*.md"
  push:
    branches: [master, insider]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 仓库结构契约：不需要装依赖（checkout 后有 node 即可，约 10 秒），
  # 因此放在最前面——它们能拦住“本地全绿但新克隆编译失败”这一类问题，
  # 而 lint/typecheck 必须在 npm install 之后才跑得动，发现得太晚。
  contract-checks:
    name: Contract Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
      - name: "Imports resolve inside the git index"
        run: node .github/workflows/_shared/check-kodrix-import-contract.mjs
      - name: "Declared commands have registerCommand() sites"
        run: node .github/workflows/_shared/check-kodrix-command-contract.mjs
      - name: "Contributed APIs match the fork registry and sources"
        run: node .github/workflows/_shared/check-kodrix-contributions.mjs

  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: ESLint
        run: npm run eslint
      - name: TypeScript type check
        run: npm run typecheck-client
      - name: Skill catalog integrity (hashes)
        run: npm run hash-skill-catalog

  extensions-test:
    name: Test ${{ matrix.extension }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        extension:
          - kodrix-agent-os
          - kodrix-local
          - kodrix-skills
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Compile & test ${{ matrix.extension }}
        working-directory: extensions/${{ matrix.extension }}
        run: |
          npm run compile:test
          npm test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: npm audit (critical)
        run: npm audit --audit-level=critical
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
