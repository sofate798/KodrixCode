name: Build Release

# 三平台真实产出：Windows / Linux / macOS
# 触发方式：
#   1. Actions 页面手动点 "Run workflow"
#   2. 推送 v* tag（如 git tag v1.128.0 && git push origin v1.128.0）
#
# 产物：每个平台一个 artifact（tar.gz，Windows 11 / macOS / Linux 均可直接解压）
#   - Kodrix-<ver>-win32-x64.tar.gz
#   - Kodrix-<ver>-linux-x64.tar.gz
#   - Kodrix-<ver>-darwin-arm64.tar.gz

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            platform: win32
            arch: x64
            gulp-task: vscode-win32-x64-min
            src-dir: VSCode-win32-x64
          - name: Linux x64
            runner: ubuntu-22.04
            platform: linux
            arch: x64
            gulp-task: vscode-linux-x64-min
            src-dir: VSCode-linux-x64
          - name: macOS arm64
            runner: macos-14
            platform: darwin
            arch: arm64
            gulp-task: vscode-darwin-arm64-min
            src-dir: VSCode-darwin-arm64

    env:
      VSCODE_ARCH: ${{ matrix.arch }}
      npm_config_arch: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
      VSCODE_SKIP_NODE_VERSION_CHECK: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Linux: 跳过 VSCodium 的 sysroot/clang 流程，直接用系统 gcc
      VSCODE_SKIP_SETUPENV: ${{ matrix.platform == 'linux' && '1' || '' }}
      # macOS: 跳过代码签名（CI 没有证书）
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'darwin' && 'false' || '' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Python (node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libkrb5-dev build-essential

      # npm install 会触发 postinstall，postinstall 自动对 build/、extensions/ 各子目录跑 npm install
      # （见 build/npm/dirs.ts），不需要手动逐个 npm install
      # 注意：用 npm install 而非 npm ci，因为 package-lock.json 和 package.json overrides 不完全同步
      - name: Install dependencies
        run: |
          echo "=== env check ==="
          which npm && which node && ls -la /bin/sh 2>/dev/null
          echo "=== npm install ==="
          npm install --no-audit --no-fund || {
            echo "=== FAILED: last 300 lines of newest npm debug log ==="
            LOGFILE=$(ls -t ~/.npm/_logs/*debug*.log 2>/dev/null | head -1)
            echo "log: $LOGFILE"
            tail -300 "$LOGFILE"
            exit 1
          }

      - name: Disk space before build
        run: df -h . || true

      - name: Build ${{ matrix.gulp-task }}
        run: |
          echo "=== Building ${{ matrix.gulp-task }} ==="
          npm run gulp -- ${{ matrix.gulp-task }}
          echo "=== Build finished ==="
          ls -la "../${{ matrix.src-dir }}" || { echo "::error::产物目录 ../${{ matrix.src-dir }} 不存在"; exit 1; }

      - name: Disk space after build
        run: df -h . || true

      - name: Pack artifact
        id: pack
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ARCHIVE="Kodrix-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          # -C .. 切到父目录再打包产物目录，避免 cd 和跨平台路径拼接问题
          tar -czf "$ARCHIVE" -C .. "${{ matrix.src-dir }}"
          ls -lh "$ARCHIVE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.archive }}
          path: ${{ steps.pack.outputs.archive }}
          retention-days: 14
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.archive }}
          generate_release_notes: true
