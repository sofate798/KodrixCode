name: Nightly Quality

on:
  schedule:
    - cron: '0 4 * * *'  # 每天 UTC 04:00（北京时间 12:00）
  workflow_dispatch:

jobs:
  compile-build:
    name: Full Compile Check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev
      - run: npm install --no-audit --no-fund
      - name: Full compile-build (gulp compile-build-with-mangling)
        env:
          VSCODE_SKIP_NODE_VERSION_CHECK: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          VSCODE_SKIP_SETUPENV: "1"
        run: npm run compile-build

  dependency-check:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: npm audit (critical)
        run: npm audit --audit-level=critical
      - name: Outdated dependencies (report only)
        run: npx --yes npm-check-updates --dep dev --format group
        continue-on-error: true
