<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 背景径向渐变 -->
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#2c2c30"/>
      <stop offset="45%" stop-color="#161618"/>
      <stop offset="100%" stop-color="#070708"/>
    </radialGradient>

    <!-- 白银金属渐变 - 左尖括号 -->
    <linearGradient id="bracketLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f4"/>
      <stop offset="45%" stop-color="#d4d4d8"/>
      <stop offset="100%" stop-color="#a4a4a8"/>
    </linearGradient>

    <!-- 白银金属渐变 - 竖线左半（亮面） -->
    <linearGradient id="silverLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7f7f9"/>
      <stop offset="55%" stop-color="#dcdce0"/>
      <stop offset="100%" stop-color="#b0b0b4"/>
    </linearGradient>

    <!-- 白银金属渐变 - 竖线右半（暗面） -->
    <linearGradient id="silverRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8b8bc"/>
      <stop offset="45%" stop-color="#d8d8dc"/>
      <stop offset="100%" stop-color="#f0f0f2"/>
    </linearGradient>

    <!-- 右上臂渐变 -->
    <linearGradient id="armGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#96969a"/>
      <stop offset="35%" stop-color="#c4c4c8"/>
      <stop offset="65%" stop-color="#e6e6e8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- 光标渐变 -->
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e4e4e8"/>
      <stop offset="70%" stop-color="#b4b4b8"/>
      <stop offset="100%" stop-color="#86868a"/>
    </linearGradient>

    <!-- 右尖括号渐变（稍暗） -->
    <linearGradient id="bracketRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bcbcc0"/>
      <stop offset="50%" stop-color="#9c9ca0"/>
      <stop offset="100%" stop-color="#747478"/>
    </linearGradient>

    <!-- 符号投影 -->
    <filter id="symbolShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset dx="0" dy="7" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.55" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- squircle 裁剪 -->
    <clipPath id="squircleClip">
      <path d="M512,190 C620,190 690,190 748,208 C790,222 816,250 830,292 C848,350 848,420 848,512 C848,604 848,674 830,732 C816,774 790,802 748,816 C690,834 620,834 512,834 C404,834 334,834 276,816 C234,802 208,774 194,732 C176,674 176,604 176,512 C176,420 176,350 194,292 C208,250 234,222 276,208 C334,190 404,190 512,190 Z"/>
    </clipPath>
  </defs>

  <!-- 图标主体 -->
  <g filter="url(#symbolShadow)">
    <!-- squircle 背景 -->
    <path d="M512,190 C620,190 690,190 748,208 C790,222 816,250 830,292 C848,350 848,420 848,512 C848,604 848,674 830,732 C816,774 790,802 748,816 C690,834 620,834 512,834 C404,834 334,834 276,816 C234,802 208,774 194,732 C176,674 176,604 176,512 C176,420 176,350 194,292 C208,250 234,222 276,208 C334,190 404,190 512,190 Z"
          fill="url(#bgGrad)"/>

    <!-- 顶部微妙高光 -->
    <path d="M512,202 C608,202 672,204 724,220 C740,225 754,232 766,242 C752,234 732,228 708,224 C656,218 588,216 512,216 C436,216 368,218 316,224 C292,228 272,234 258,242 C270,232 284,225 300,220 C352,204 416,202 512,202 Z"
          fill="#ffffff" opacity="0.05"/>

    <!-- 负空间 C 圆环（开口朝右，干净的圆弧） -->
    <g clip-path="url(#squircleClip)" opacity="0.55">
      <!-- C 形：从右上约 35 度，绕左侧到右下约 325 度，右侧开口 -->
      <path d="M656,388 
               A200,200 0 1,0 656,656"
            fill="none" stroke="#232327" stroke-width="38" stroke-linecap="round"/>
    </g>

    <!-- 左尖括号 < -->
    <path d="M354,464 L280,532 L354,600 L340,614 L262,532 L340,450 Z"
          fill="url(#bracketLeft)"/>

    <!-- K 竖线 - 左半亮面 -->
    <path d="M402,376 L464,376 L464,528 L402,528 Z"
          fill="url(#silverLeft)"/>

    <!-- K 竖线 - 右半暗面（带底部斜切） -->
    <path d="M464,376 L464,688 L416,706 L402,688 L402,528 L464,528 Z"
          fill="url(#silverRight)"/>

    <!-- 竖线底部斜切高光 -->
    <path d="M402,688 L416,706 L464,688 L464,670 L416,686 Z"
          fill="#ffffff" opacity="0.35"/>

    <!-- 竖线中部分割线（微妙） -->
    <line x1="402" y1="528" x2="464" y2="528" stroke="#000000" stroke-width="1" opacity="0.15"/>

    <!-- K 右上臂 -->
    <path d="M464,508 L650,370 L674,404 L488,542 Z"
          fill="url(#armGrad)"/>

    <!-- 右上臂底部暗边（增加厚度感） -->
    <path d="M464,508 L488,542 L674,404 L666,392 L464,500 Z"
          fill="#000000" opacity="0.18"/>

    <!-- AI 光标箭头 -->
    <path d="M510,520 L510,656 L544,622 L568,666 L590,654 L566,610 L608,610 Z"
          fill="url(#cursorGrad)"/>

    <!-- 光标左侧高光边 -->
    <path d="M510,520 L518,528 L518,648 L510,656 Z"
          fill="#ffffff" opacity="0.45"/>

    <!-- 光标底部暗面 -->
    <path d="M510,656 L544,622 L552,636 L518,664 Z"
          fill="#000000" opacity="0.22"/>

    <!-- 右尖括号 >（稍暗，前后层次） -->
    <path d="M670,464 L744,532 L670,600 L684,614 L762,532 L684,450 Z"
          fill="url(#bracketRight)"/>

    <!-- 右尖括号顶部暗边 -->
    <path d="M670,464 L684,450 L762,532 L754,540 L684,472 L670,486 Z"
          fill="#000000" opacity="0.12"/>
  </g>

  <!-- 图标外轮廓微妙高光描边 -->
  <path d="M512,190 C620,190 690,190 748,208 C790,222 816,250 830,292 C848,350 848,420 848,512 C848,604 848,674 830,732 C816,774 790,802 748,816 C690,834 620,834 512,834 C404,834 334,834 276,816 C234,802 208,774 194,732 C176,674 176,604 176,512 C176,420 176,350 194,292 C208,250 234,222 276,208 C334,190 404,190 512,190 Z"
        fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.12"/>
</svg>